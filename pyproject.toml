[project]
name = "deep-and-reinforced"
version = "0.1.0"
description = "Machine learning experiments managed with uv."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "black>=26.5.1",
    "eel>=0.18.2",
    "fairseq>=0.12.2",
    "gymnasium>=1.0.0",
    "ipywidgets>=8.1.8",
    "kagglehub>=1.0.1",
    "matplotlib>=3.10.9",
    "mss>=10.2.0",
    "numpy<2.4",
    "opencv-python>=4.13.0.92",
    "pandas-stubs~=3.0.3",
    "pillow>=11.2.1",
    "pygame>=2.6.0",
    "pyglet>=2.1.14",
    "sentencepiece>=0.2.1",
    "stable-baselines3>=2.3.0",
    "tianshou>=2.0.1",
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "tqdm>=4.67.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "torchview>=0.2.7",
]

[tool.black]
target-version = ["py313"]
line-length = 88

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "experiments/pic-classify/src/pic_classify",
    "experiments/neural_network/src/neural_network",
    "experiments/rl/cliff-walking/src/cliff_walking",
]

[tool.pytest.ini_options]
testpaths = ["experiments"]

[project.scripts]
pic-classify-train = "pic_classify.train:main"
pic-classify-predict = "pic_classify.predict:main"
mnist-train = "neural_network.mnist:train_main"
mnist-predict = "neural_network.mnist:predict_main"
mnist-evaluate = "neural_network.mnist:evaluate_main"
mnist-visualize = "neural_network.visualize:visualize_main"
cliff-walking-play = "cliff_walking.env:main"
cliff-walking-train = "cliff_walking.train:main"
cliff-walking-dqn = "cliff_walking.dqn_train:main"
