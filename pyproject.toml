[project]
name = "deep-and-reinforced"
version = "0.1.0"
description = "Machine learning experiments managed with uv."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy<2.4",
    "pillow>=11.2.1",
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "tqdm>=4.67.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["experiments/pic-classify/src/pic_classify"]

[tool.pytest.ini_options]
testpaths = ["experiments"]

[project.scripts]
pic-classify-train = "pic_classify.train:main"
pic-classify-predict = "pic_classify.predict:main"
